[package]
name = "canting"
version = "1.0.0"
edition = "2021"
authors = ["Slamet Sugandi <packercyber@gmail.com>"]
description = "The official Artisan-like CLI toolchain for Pakem Framework"
license = "MIT"
repository = "https://github.com/pakem-rs/framework"
homepage = "https://pakem.my.id"
readme = "README.md"
keywords = ["pakem", "canting", "cli", "artisan", "laravel"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
indicatif = "0.17"
colored = "2"
fs_extra = "1.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4.44"
dotenv = "0.15"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "postgres", "mysql", "sqlite", "chrono"] }
rustyline = "14"
pakem = { path = "..", package = "pakem", version = "1.0.0" }

[[bin]]
name = "canting"
path = "src/main.rs"
