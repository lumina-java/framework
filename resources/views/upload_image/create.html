{% extends "dashboard_layout.html" %}

{% block content %}
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-800">Tambah UploadImage</h1>
        <p class="text-sm text-slate-500">Silakan pilih file gambar untuk di-upload kawan.</p>
    </div>
    <div>
        <a href="/upload_images" class="inline-flex items-center justify-center px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg shadow-sm transition-colors duration-200" hx-boost="true">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Batal
        </a>
    </div>
</div>

<div class="max-w-2xl bg-white rounded-xl shadow-sm border border-slate-100 p-6 md:p-8">
    <form action="/upload_images" method="POST" enctype="multipart/form-data" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div>
            <label for="file" class="block text-sm font-semibold text-slate-700 mb-2">File Gambar</label>
            <input type="file" 
                   id="file" 
                   name="file" 
                   accept="image/*"
                   class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                   required>
        </div>

        <div class="flex justify-end pt-4">
            <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-sm transition-colors duration-200">
                Simpan & Upload
            </button>
        </div>
    </form>
</div>
{% endblock %}
