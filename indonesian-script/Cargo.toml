[package]
name = "indonesian-script"
version = "0.1.2"
edition = "2021"
authors = ["Slamet Sugandi <packercyber@gmail.com>"]
description = "Indonesian Script (.is) - Super lightweight reactive JavaScript compiler in Rust with Indonesian & Javanese syntax helpers"
license = "MIT"
repository = "https://github.com/lumina-java/indonesia-script"
homepage = "https://github.com/lumina-java/indonesia-script"
readme = "README.md"
keywords = ["indonesian-script", "compiler", "javascript", "reactive", "wasm"]
categories = ["compilers", "wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1"
clap = { version = "4", features = ["derive"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]
wasm = ["dep:wasm-bindgen"]

[[bin]]
name = "is-cli"
path = "src/bin/is.rs"
required-features = ["cli"]
