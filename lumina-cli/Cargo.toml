[package]
name = "cargo-lumina"
version = "0.1.4"
edition = "2021"
authors = ["Lumina Java <admin@lumina-java.com>"]
description = "The Lumina Framework Installer"
license = "MIT"
repository = "https://github.com/lumina-java/framework"
homepage = "https://github.com/lumina-java/lumina"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
zip = "2.2"
indicatif = "0.17"
colored = "2"
fs_extra = "1.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4.44"

[[bin]]
name = "lumina"
path = "src/main.rs"
