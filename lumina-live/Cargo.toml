[package]
name = "lumina-live"
version = "0.5.0"
edition = "2021"
authors = ["Slamet Sugandi <packercyber@gmail.com>"]
description = "Server-Driven Reactive UI for Lumina Framework (inspired by Laravel Livewire & Phoenix LiveView)"
license = "MIT"
repository = "https://github.com/lumina-java/lumina-live"
homepage = "https://github.com/lumina-java/lumina-live"
readme = "README.md"
keywords = ["lumina", "livewire", "reactive", "server-driven-ui", "fullstack"]
categories = ["web-programming::http-server", "gui"]

[dependencies]
lumina = { package = "lumina-framework", version = "0.5.0", path = ".." }
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
