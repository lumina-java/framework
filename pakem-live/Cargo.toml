[package]
name = "pakem-live"
version = "1.0.0"
edition = "2021"
authors = ["Slamet Sugandi <packercyber@gmail.com>"]
description = "Server-Driven Reactive UI for Pakem Framework (inspired by Laravel Livewire & Phoenix LiveView)"
license = "MIT"
repository = "https://github.com/pakem-rs/framework"
homepage = "https://pakem.my.id"
readme = "README.md"
keywords = ["pakem", "livewire", "reactive", "server-driven-ui", "fullstack"]
categories = ["web-programming::http-server", "gui"]

[dependencies]
pakem = { package = "pakem", version = "1.0.0", path = ".." }
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
