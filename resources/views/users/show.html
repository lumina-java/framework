{% extends "layout.html" %}

{% block title %}User Profile - Lumina Framework{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="nav mb-4">
                <a href="/users" class="text-decoration-none">← Back to Users</a>
            </div>

            <div class="card shadow border-0 overflow-hidden" style="border-radius: 1.5rem;">
                <div class="card-header bg-primary text-white text-center py-5 border-0" style="background: linear-gradient(135deg, #6366f1 0%, #a78bfa 100%) !important;">
                    <div class="mb-3">
                        <span class="display-1">👤</span>
                    </div>
                    <h2 class="fw-bold mb-0">{{ name }}</h2>
                    <p class="opacity-75">ID: #{{ id }}</p>
                </div>
                <div class="card-body p-5">
                    <div class="mb-4">
                        <label class="small text-muted text-uppercase fw-bold mb-1">Email Address</label>
                        <p class="fs-5 mb-0">{{ email }}</p>
                    </div>
                    <div class="mb-4">
                        <label class="small text-muted text-uppercase fw-bold mb-1">Role</label>
                        <p class="fs-5 mb-0"><span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">Developer</span></p>
                    </div>
                    <hr class="my-4 opacity-10">
                    <div class="d-grid">
                        <button class="btn btn-primary py-3 fw-bold rounded-pill">Edit Profile</button>
                    </div>
                </div>
            </div>

            <div class="mt-4 text-center">
                <p class="text-muted small">Data di atas dirender menggunakan <strong>Tera Template Engine</strong>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
