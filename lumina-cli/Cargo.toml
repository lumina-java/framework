[package]
name = "lumina-cli"
version = "0.5.0"
edition = "2021"
authors = ["Slamet Sugandi <packercyber@gmail.com>"]
description = "The official Artisan-like CLI toolchain for Lumina Framework"
license = "MIT"
repository = "https://github.com/lumina-java/lumina-cli"
homepage = "https://github.com/lumina-java/lumina-cli"
readme = "README.md"
keywords = ["lumina", "cli", "artisan", "laravel", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
indicatif = "0.17"
colored = "2"
fs_extra = "1.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4.44"
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "postgres", "mysql", "sqlite", "chrono"] }

[[bin]]
name = "lumina"
path = "src/main.rs"
