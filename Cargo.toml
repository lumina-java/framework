[package]
name = "lumina"
version = "0.1.0"
edition = "2021"
authors = ["Slamet Sugandi <packercyber@gmail.com>"]
description = "A beautiful, fast, and elegant web framework for Rust"
license = "MIT"

[lib]
name = "lumina"
path = "src/lib.rs"

[[bin]]
name = "lumina-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "macros", "any"] }
jsonwebtoken = "9"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
tera = "1.19"
regex = "1"
validator = { version = "0.18", features = ["derive"] }

[[bin]]
name = "lumina"
path = "src/bin/lumina.rs"
