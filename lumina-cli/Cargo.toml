[package]
name = "lumina-cli"
version = "0.3.1"
edition = "2021"
authors = ["Slamet Sugandi <packercyber@gmail.com>"]
description = "The Lumina Framework CLI Toolchain"
license = "MIT"
repository = "https://github.com/lumina-java/framework"
homepage = "https://github.com/lumina-java/lumina"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
indicatif = "0.17"
colored = "2"
fs_extra = "1.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4.44"
dotenv = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "postgres", "mysql", "sqlite", "chrono"] }

[[bin]]
name = "lumina"
path = "src/main.rs"
