[package]
name = "lumina-framework"
version = "0.5.0"
edition = "2021"
authors = ["Lumina Java <admin@lumina-java.com>"]
description = "A beautiful, fast, and elegant web framework for Rust"
license = "MIT"
repository = "https://github.com/lumina-java/framework"
homepage = "https://github.com/lumina-java/framework"
readme = "README.md"

[lib]
name = "lumina"
path = "src/lib.rs"

[workspace]
members = ["lumina_macros", "lumina-cli", "indonesian-script", "lumina-live"]

[dependencies]
lumina_macros = { path = "lumina_macros", version = "0.1.4" }
indonesian-script = { path = "indonesian-script", version = "0.1.2" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
dotenv = "0.15"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "any", "chrono", "uuid", "rust_decimal"] }
jsonwebtoken = "9"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
regex = "1"
validator = { version = "0.18", features = ["derive"] }
bcrypt = "0.15"
tower-http = { version = "0.5", features = ["catch-panic", "cors", "trace", "fs"] }
axum-extra = { version = "0.9", features = ["cookie", "cookie-private"] }
tower = { version = "0.4", features = ["util"] }
thiserror = "2.0.18"
tower-sessions = "0.12"
tower-sessions-sqlx-store = { version = "0.13", default-features = false }
time = "0.3.47"
axum_csrf = { version = "0.10.0", features = ["layer"] }
moka = { version = "0.12.15", features = ["future"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde", "maths"] }
rust_decimal_macros = "1"
image = "0.25"
oauth2 = "4.4"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
rustyline = "14.0"
tokio-cron-scheduler = "0.10"
zip = "2.2"
walkdir = "2"
wasmi = "2.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"


[features]
default = ["postgres", "sqlite"]
all = ["sqlite", "postgres", "mysql", "mssql"]
sqlite = ["sqlx/sqlite", "tower-sessions-sqlx-store/sqlite"]
postgres = ["sqlx/postgres", "tower-sessions-sqlx-store/postgres"]
mysql = ["sqlx/mysql", "tower-sessions-sqlx-store/mysql"]
mssql = []

[[bin]]
name = "lumina"
path = "src/bin/lumina.rs"

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true



