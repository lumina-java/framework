[package]
name = "lumina_macros"
version = "0.1.2"
edition = "2021"
authors = ["Slamet Sugandi <packercyber@gmail.com>"]
description = "Procedural macros for Lumina Framework (LuminaModel derive and form validation)"
license = "MIT"
repository = "https://github.com/lumina-java/framework"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
